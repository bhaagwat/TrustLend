# ---------------------------------------------------------------
#  TrustLend default configuration (Unit 3: properties files)
#  A user copy is written to data/config.properties on first run;
#  edit that file (or the Settings screen) to override these values.
# ---------------------------------------------------------------

app.name=TrustLend
app.version=1.0.0

# Databases: one shared accounts file + one workspace file per account
accounts.path=data/accounts.db
workspace.dir=data/workspaces
# Database of older versions (single shared workspace); moved to the "admin" account on first start
legacy.db.path=data/trustlend.db

# Score range (CIBIL-style 300 - 900)
score.min=300
score.max=900

# Factor weights (must add up to 1.0; they are normalised anyway)
weight.consistency=0.30
weight.repayment=0.35
weight.tenure=0.10
weight.network=0.25

# Trust propagation (EigenTrust / personalised PageRank)
graph.damping=0.70
graph.iterations=40
graph.tolerance=0.000001
# Each defaulted loan of someone you vouched for reduces your credibility by this much
graph.voucher.penalty=0.15

# Consistency window in weeks
consistency.window.weeks=12

# Loan policy
loan.interest.base=18.0
loan.min.score=500
loan.tenure.default.weeks=12

# Files
backup.dir=data/backups
export.dir=data/exports
